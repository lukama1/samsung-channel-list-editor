<div class="wrap">
<div class="top"><div class="topText"><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="lang"><button id="trBtn">🇹🇷 TR</button><button id="enBtn">🇬🇧 EN</button></div></div>

      <button id="sortNo"></button><button id="sortName"></button><button id="selTop"></button><button id="selBottom"></button>

</div>
<div class="footer" id="footer"></div>
</div>

<div class="modal" id="pickerModal"><div class="modal-box">
  <div class="toolbar"><strong id="pickerTitle"></strong><span class="spacer"></span><button id="pickerClose">✕</button></div>
  <div class="modal-grid">
    <div><input id="pickerSearch" type="search" style="width:100%"><div class="pick-list" id="pickerResults"></div></div>
    <div><div class="pick-list" id="pickerChosen"></div></div>
  </div>
  <div class="footer-actions"><button id="pickerClear"></button><button id="pickerCancel"></button><button class="primary" id="pickerApply"></button></div>
</div></div>

$('trBtn').onclick=()=>{lang='tr';localStorage.setItem('samsung-editor-lang',lang);applyText()};$('enBtn').onclick=()=>{lang='en';localStorage.setItem('samsung-editor-lang',lang);applyText()};
let SQL=null,format=null,sourceFile=null,zip=null,db=null,scmEntries=null,scmMapEntry=null,channels=[],originalState=null,selected=new Set(),lastClicked=null,filterType='all',dragId=null,pickOrder=[],dirty=false;
const setLoad=(m,c='')=>{$('loadStatus').className='status '+c;$('loadStatus').textContent=m},setEdit=(m,c='')=>{$('editStatus').className='status '+c;$('editStatus').textContent=m};
function sqlRows(d,s,p=[]){const st=d.prepare(s);st.bind(p);const o=[];while(st.step())o.push(st.getAsObject());st.free();return o}async function initSql(){if(SQL)return SQL;SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});return SQL}function decodeUtf16BE(b){if(!b)return'';return new TextDecoder('utf-16be').decode(b).replace(/\0/g,'').trim()}
function isRadio(c){return c.type==='radio'}function activeChannels(){return channels.filter(c=>!c.deleted)}
function visible(){const q=$('search').value.trim().toLocaleLowerCase(lang==='tr'?'tr-TR':'en-US'),enc=$('encFilter').value,showDel=$('showDeleted').checked;let list=channels.filter(c=>showDel||!c.deleted);if(filterType!=='all')list=list.filter(c=>c.type===filterType);if(q)list=list.filter(c=>c.name.toLocaleLowerCase().includes(q)||String(c.major).includes(q));if(enc==='enc')list=list.filter(c=>c.scrambled);if(enc==='free')list=list.filter(c=>!c.scrambled);return list.sort((a,b)=>a.major-b.major)}

function render(){const t=trn(),list=visible(),tb=$('tbody');tb.textContent='';for(const c of list){const tr=document.createElement('tr');tr.dataset.id=c.id;tr.draggable=!c.deleted;if(selected.has(c.id))tr.classList.add('selected');if(c.deleted)tr.classList.add('deleted');const h=document.createElement('td');h.textContent='⋮⋮';tr.appendChild(h);const tdC=document.createElement('td'),cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(c.id);tdC.appendChild(cb);tr.appendChild(tdC);const tdN=document.createElement('td'),ni=document.createElement('input');ni.type='number';ni.className='num';ni.value=c.major;ni.disabled=c.deleted;ni.onchange=()=>{const v=Number(ni.value);if(Number.isInteger(v)&&v>=0)c.major=v;else ni.value=c.major};tdN.appendChild(ni);tr.appendChild(tdN);for(const v of[c.name,isRadio(c)?t.radio:'TV',c.scrambled?t.yes:t.no,c.freq?c.freq:'—',c.pol||'—',c.sr||'—']){const td=document.createElement('td');td.textContent=v;if(v===c.name)td.className='name';tr.appendChild(td)}tr.onclick=e=>{if(e.target===ni)return;const idx=list.findIndex(x=>x.id===c.id);if(e.shiftKey&&lastClicked!==null){const j=list.findIndex(x=>x.id===lastClicked);if(j>=0){for(let k=Math.min(idx,j);k<=Math.max(idx,j);k++)selected.add(list[k].id)}}else{selected.has(c.id)?selected.delete(c.id):selected.add(c.id)}lastClicked=c.id;render()};tr.ondragstart=()=>{dragId=c.id};tr.ondragover=e=>e.preventDefault();tr.ondrop=e=>{e.preventDefault();moveSelectionTo(c.id)};tb.appendChild(tr)}$('headerCheck').checked=list.length>0&&list.every(c=>selected.has(c.id));$('chips').innerHTML=[`${t.format}: ${format?.toUpperCase()||'-'}`,`${t.total}: ${channels.filter(c=>!c.deleted).length}`,`${t.shown}: ${list.length}`,`${t.selected}: ${selected.size}`,`${t.deleted}: ${channels.filter(c=>c.deleted).length}`].map(x=>`<span class="chip">${x}</span>`).join('');$('tabAll').classList.toggle('active',filterType==='all');$('tabTv').classList.toggle('active',filterType==='tv');$('tabRadio').clas function moveSelectionTo(targetId){const act=activeChannels().sort((a,b)=>a.major-b.major),moving=selected.size&&selected.has(dragId)?act.filter(c=>selected.has(c.id)):act.filter(c=>c.id===dragId),rest=act.filter(c=>!moving.some(m=>m.id===c.id));let idx=rest.findIndex(c=>c.id===targetId);if(idx<0)idx=rest.length;rest.splice(idx,0,...moving);const start=Math.min(...act.map(c=>c.major));rest.forEach((c,i)=>c.major=start+i);setDirty(true);render()}

function ensureUniqueActiveNumbers(){const active=activeChannels();if(!active.length)return false;const nums=active.map(c=>Number(c.major)),valid=nums.every(n=>Number.isInteger(n)&&n>=0),unique=new Set(nums).size===nums.length;if(valid&&unique)return false;const ordered=active.slice().sort((a,b)=>{const an=Number.isFinite(Number(a.major))?Number(a.major):Number.MAX_SAFE_INTEGER,bn=Number.isFinite(Number(b.major))?Number(b.major):Number.MAX_SAFE_INTEGER;return an-bn||String(a.id).localeCompare(String(b.id))});const finite=nums.filter(n=>Number.isInteger(n)&&n>=0),start=finite.length?Math.min(...finite):1;applyFullUniqueOrder(ordered,start);return true}
function deleteWhere(pred){const list=activeChannels().filter(pred);if(!list.length){setEdit(trn().none,'err');return}if(!confirm(trn().confirmDelete(list.length)))return;list.forEach(c=>c.deleted=true);selected.clear();setDirty(true);render()}
function sortAll(compare){const list=activeChannels().sort(compare),start=Math.min(...list.map(c=>c.major));renumberList(list,start)}function moveSelected(top=true){if(!selected.size)return;const list=activeChannels().sort((a,b)=>a.major-b.major),a=list.filter(c=>selected.has(c.id)),b=list.filter(c=>!selected.has(c.id)),start=Math.min(...list.map(c=>c.major));renumberList(top?[...a,...b]:[...b,...a],start)}
function pickerRender(){const q=$('pickerSearch').value.trim().toLocaleLowerCase(),res=$('pickerResults'),cho=$('pickerChosen');res.textContent='';cho.textContent='';if(q){activeChannels().filter(c=>c.name.toLocaleLowerCase().includes(q)&&!pickOrder.includes(c.id)).slice(0,200).forEach(c=>{const d=document.createElement('div');d.className='pick-item';d.textContent=`${c.major} · ${c.name}`;d.onclick=()=>{pickOrder.push(c.id);pickerRender()};res.appendChild(d)})}pickOrder.forEach((id,i)=>{const c=channels.find(x=>x.id===id);if(!c)return;const d=document.createElement('div');d.className='pick-item';const s=document.createElement('span');s.textContent=`${i+1}. ${c.name}`;d.appendChild(s);const up=document.createElement('button');up.textContent='↑';up.onclick=()=>{if(i>0){[pickOrder[i-1],pickOrder[i]]=[pickOrder[i],pickOrder[i-1]];pickerRender()}};const down=document.createElement('button');down.textContent='↓';down.onclick=()=>{if(i<pickOrder.length-1){[pickOrder[i+1],pickOrder[i]]=[pickOrder[i],pickOrder[i+1]];pickerRender()}};const rm=document.createElement('button');rm.textContent='✕';rm.onclick=()=>{pickOrder.splice(i,1);pickerRender()};d.append(up,down,rm);cho.appendChild(d)})}
async function loadFile(f){try{setLoad(trn().loading);sourceFile=f;format=f.name.toLowerCase().endsWith('.scm')?'scm':'zip';if(format==='zip')await loadZip(f);else await loadScm(f);originalState=snapshot();setDirty(false);$('intro').classList.add('hidden');$('editor').classList.remove('hidden');setEdit(trn().opened(f.name,channels.length,format),'ok');render()}catch(e){console.error(e);setLoad(trn().openFail+(e.message||e),'err')}}
async function loadZip(f){await initSql();zip=await JSZip.loadAsync(await f.arrayBuffer());const e=zip.file('dvbs');if(!e)throw Error("'dvbs' database not found");db=new SQL.Database(new Uint8Array(await e.async('arraybuffer')));const tables=new Set(sqlRows(db,"select name from sqlite_master where type='table'").map(x=>x.name));for(const n of['CHNL','SRV','SRV_DVB'])if(!tables.has(n))throw Error('Missing Samsung table: '+n);channels=sqlRows(db,"select SRV.srvId srvId,SRV.major major,cast(SRV.srvName as blob) srvName,SRV.srvType srvType,SRV.scrambled scrambled,CHNL.freq freq,CHNL.sr sr,CHNL.pol pol from SRV inner join CHNL on CHNL.chId=SRV.chId where ifnull(SRV.elim,0)=0 order by SRV.major").map(r=>({id:'z'+Number(r.srvId),srvId:Number(r.srvId),major:Number(r.major),name:decodeUtf16BE(r.srvName),type:(Number(r.srvType)===2||Number(r.srvType)===10)?'radio':'tv',scrambled:Number(r.scrambled)!==0,freq:Number(r.freq||0),pol:Number(r.pol)===0?'H':Number(r.pol)===1?'V':'—',sr:Number(r.sr||0),deleted:false}))}
async function loadScm(f){scmEntries=await JSZip.loadAsync(await f.arrayBuffer());scmMapEntry=scmEntries.file('map-SateD');if(!scmMapEntry)throw Error("SCM içinde 'map-SateD' bulunamadı");const raw=new Uint8Array(await scmMapEntry.async('arraybuffer'));const REC=168;if(raw.length%REC)throw Error('Unexpected map-SateD size');channels=[];for(let i=0;i<raw.length/REC;i++){const b=i*REC,rec=raw.slice(b,b+REC);if(rec.every(x=>x===0))continue;const major=rec[0]|(rec[1]<<8),stype=rec[14],name=decodeUtf16BE(rec.slice(36,132)),scr=rec[136]===1;channels.push({id:'s'+i,slot:i,major,name,type:stype===2?'radio':'tv',serviceType:stype,scrambled:scr,freq:0,pol:'—',sr:0,deleted:false,raw:rec})}}
function applyScmRecord(c){c.raw[0]=c.major&255;c.raw[1]=(c.major>>8)&255;let sum=0;for(let i=0;i<167;i++)sum+=c.raw[i];c.raw[167]=sum&255}
async function saveFile(){try{const normalized=ensureUniqueActiveNumbers();if(normalized)setEdit(lang==='tr'?'Çakışan kanal numaraları otomatik olarak benzersiz sıraya dönüştürüldü.':'Conflicting channel numbers were automatically normalized to a unique sequence.','ok');if(format==='zip'){db.run('BEGIN');try{let delIds=channels.filter(c=>c.deleted).map(c=>c.srvId);for(const id of delIds){const tables=sqlRows(db,"select name from sqlite_master where sql like '%srvId%'").map(x=>x.name).filter(n=>/^[A-Za-z0-9_]+$/.test(n));for(const tbl of tables){try{db.run(`delete from ${tbl} where srvId=?`,[id])}catch(_){}}}let st=db.prepare('update SRV set major=? where srvId=?');activeChannels().forEach((c,i)=>st.run([1000000+i,c.srvId]));st.free();st=db.prepare('update SRV set major=? where srvId=?');activeChannels().forEach(c=>st.run([c.major,c.srvId]));st.free();db.run('COMMIT')}catch(e){try{db.run('ROLLBACK')}catch(_){}throw e}const chk=sqlRows(db,'pragma integrity_check'),k=Object.keys(chk[0]||{})[0];if(!chk[0]||chk[0][k]!=='ok')throw Error('SQLite integrity check failed');zip.file('dvbs',db.export(),{binary:true});const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),name=sourceFile.name.replace(/\.zip$/i,'')+'_edited.zip';download(blob,name);setDirty(false);setEdit(trn().saved(name),'ok')}else{const kept=channels.filter(c=>!c.deleted).sort((a,b)=>a.slot-b.slot);const totalSlots=(await scmMapEntry.async('uint8array')).length/168,out=new Uint8Array(totalSlots*168);kept.forEach((c,i)=>{applyScmRecord(c);out.set(c.raw,i*168)});scmEntries.file('map-SateD',out);const blob=await scmEntries.generateAsync({type:'blob',compression:'DEFLATE'});const name=sourceFile.name;download(blob,name);setDirty(false);setEdit(trn().saved(name),'ok')}}catch(e){setEdit(e.message||String(e),'err')}}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
$('drop').onclick=()=>$('file').click();$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');const f=e.dataTransfer.files?.[0];if(f)loadFile(f)};$('file').onchange=()=>$('file').files?.[0]&&loadFile($('file').files[0]);$('search').oninput=render;$('encFilter').onchange=render;$('showDeleted').onchange=render;$('tabAll').onclick=()=>{filterType='all';render()};$('tabTv').onclick=()=>{filterType='tv';render()};$('tabRadio').onclick=()=>{filterType='radio';render()};$('selectVisible').onclick=()=>{visible().forEach(c=>selected.add(c.id));render()};$('clearSelection').onclick=()=>{selected.clear();render()};$('selectFirst').onclick=()=>{selected=new Set(visible().slice(0,Math.max(1,Number($('firstN').value)||10)).map(c=>c.id));render()};$('headerCheck').onchange=e=>{if(e.target.checked)visible().forEach(c=>selected.add(c.id));else selected.clear();render()};$('sortNo').onclick=()=>sortAll((a,b)=>a.major-b.major);$('sortName').onclick=()=>sortAll((a,b)=>a.name.localeCompare(b.name,lang==='tr'?'tr':'en'));$('selTop').onclick=()=>moveSelected(true);$('selBottom').onclick=()=>moveSelected(false);$('renumberVisible').onclick=()=>renumberList(visible().filter(c=>!c.deleted),Number($('startNo').value)||1);$('deleteSelected').onclick=()=>deleteWhere(c=>selected.has(c.id));$('restoreSelected').onclick=()=>{const list=channels.filter(c=>selected.has(c.id)&&c.deleted);if(list.length){list.forEach(c=>c.deleted=false);setDirty(true)}render()};$('deleteTv').onclick=()=>deleteWhere(c=>!isRadio(c));$('deleteRadio').onclick=()=>deleteWhere(c=>isRadio(c));$('deleteEnc').onclick=()=>deleteWhere(c=>c.scrambled);$('deleteFree').onclick=()=>deleteWhere(c=>!c.scrambled);$('deleteEmpty').onclick=()=>deleteWhere(c=>!c.name||!c.name.trim());$('reset').onclick=restoreSnapshot;$('save').onclick=saveFile;function setupMenu(btn,panel){$(btn).onclick=e=>{e.stopPropagation();$(panel).classList.toggle('open')};$(panel).onclick=e=>{if(e.target.tagName==='BUTTON')$(panel).classList.remove('open')}}setupMenu('sortMenuBtn','sortMenu');setupMenu('deleteMenuBtn','deleteMenu');document.addEventListener('click',()=>document.querySelectorAll('.menu-panel.open').forEach(x=>x.classList.remove('open')));$('openPicker').onclick=()=>{pickOrder=[];$('pickerSearch').value='';$('pickerModal').classList.add('open');pickerRender()};$('pickerClose').onclick=$('pickerCancel').onclick=()=>$('pickerModal').classList.remove('open');$('pickerSearch').oninput=pickerRender;$('pickerClear').onclick=()=>{pickOrder=[];pickerRender()};$('pickerApply').onclick=()=>{if(!pickOrder.length)return;const act=activeChannels().slice().sort((a,b)=>a.major-b.major||String(a.id).localeCompare(String(b.id))),picked=pickOrder.map(id=>channels.find(c=>c.id===id)).filter(c=>c&&!c.deleted),rest=act.filter(c=>!pickOrder.includes(c.id)),requested=Number($('startNo').value),start=Number.isInteger(requested)&&requested>=0?requested:(act.length?Math.max(0,Math.min(...act.map(c=>c.major))):1);applyFullUniqueOrder([...picked,...rest],start);setEdit(lang==='tr'?`${picked.length} seçili kanal başa alındı; tüm aktif liste ${start}'den itibaren çakışmasız numaralandırıldı.`:`${picked.length} selected channels moved to the top; the full active list was uniquely renumbered from ${start}.`,'ok');$('pickerModal').classList.remove('open')};applyText()})();
