(()=>{'use strict';const $=x=>document.getElementById(x);let lang=localStorage.getItem('samsung-editor-lang')||((navigator.language||'tr').toLowerCase().startsWith('tr')?'tr':'en');const T={tr:{title:'Samsung ZIP Kanal Listesi Düzenleyici',sub:'Samsung Channel_list_*.zip içindeki dvbs SQLite kanal listesini tarayıcıda düzenler. Dosya sunucuya gönderilmez.',compat:'Uyumluluk',body:'<p><span class="good">Hedef format:</span> Samsung <code>Channel_list_*.zip</code> içinde <code>dvbs</code>/<code>sat</code> SQLite veritabanları ve <code>CHNL</code>, <code>SRV</code>, <code>SRV_DVB</code> tabloları.</p><p>Bu biçim Samsung <strong>J serisi (2015)</strong> ile yaygınlaşmıştır ve aynı temel yapı <strong>en az 2022 model yılına kadar</strong> görülür.</p><ul class="support"><li><strong>Tipik destek:</strong> 2015+ Samsung TV\'ler, bu ZIP/SQLite biçimini dışa aktarıyorsa.</li><li><strong>2022 sonrası:</strong> Aynı iç yapıyı kullanıyorsa çalışabilir.</li><li><strong>2014 ve daha eski:</strong> Çoğu <code>.scm</code>/<code>map-*</code> kullanır; bu sürüm desteklemez.</li><li>Model yılından çok dosyanın gerçek yapısı belirleyicidir.</li><li>Bu sürüm DVB-S / uydu kanal sıralamasına odaklanır.</li></ul>',detect:'Kontrol: Editör gerekli SQLite tablolarını doğrular; yapı uygun değilse dosyayı değiştirmez.',drop:'Samsung kanal listesi ZIP dosyasını buraya bırakın',choose:'veya seçmek için tıklayın',search:'Kanal ara…',sort:'Numaraya göre sırala',renumber:"Sırayı 1'den numarala",start:'Başlangıç',apply:'Bu sırayı numarala',reset:'Değişiklikleri sıfırla',save:"Düzenlenmiş ZIP'i kaydet",note:'Satırları sürükleyip bırakabilirsiniz. Yalnız kanal sıra numarası (SRV.major) değiştirilir; frekans, PID ve kanal adına dokunulmaz.',channel:'Kanal',type:'Tür',scr:'Şifreli',freq:'Frekans',yes:'Evet',no:'Hayır',radio:'Radyo',total:'Toplam',changed:'Numarası değişen',loading:'SQLite motoru yükleniyor…',reading:'ZIP okunuyor…',opened:(f,n)=>`${f} açıldı. ${n} kanal bulundu.`,openFail:'Açılamadı: ',filter:'Arama filtresi açıkken toplu numaralandırma yapılmaz.',numbered:(n,s)=>`${n} kanal ${s}\'den başlayarak numaralandırıldı.`,sorted:'Kanal listesi mevcut numaralara göre sıralandı.',resetMsg:'Bu oturumdaki numara değişiklikleri sıfırlandı.',saved:f=>`Kaydedildi: ${f}. TV\'ye yüklemeden önce orijinal ZIP\'i saklayın.`,footer:'Bu araç Samsung Electronics ile bağlantılı veya Samsung tarafından onaylanmış değildir. Orijinal kanal listesi ZIP dosyanızı yedekleyin.'},en:{title:'Samsung ZIP Channel List Editor',sub:'Edit the dvbs SQLite channel list inside Samsung Channel_list_*.zip exports directly in your browser. Your file is not uploaded to a server.',compat:'Compatibility',body:'<p><span class="good">Target format:</span> Samsung <code>Channel_list_*.zip</code> archives containing <code>dvbs</code>/<code>sat</code> SQLite databases with <code>CHNL</code>, <code>SRV</code> and <code>SRV_DVB</code> tables.</p><p>This format became common with Samsung <strong>J-series (2015)</strong> and the same basic structure is documented through <strong>at least model year 2022</strong>.</p><ul class="support"><li><strong>Typical support:</strong> 2015+ Samsung TVs exporting this ZIP/SQLite format.</li><li><strong>After 2022:</strong> May work when the same internal structure is retained.</li><li><strong>2014 and older:</strong> Many use <code>.scm</code>/<code>map-*</code>; not supported here.</li><li>The actual exported structure matters more than model year.</li><li>This build focuses on DVB-S / satellite ordering.</li></ul>',detect:'Detection: Required SQLite tables are validated before editing; unsupported files are left unchanged.',drop:'Drop your Samsung channel-list ZIP file here',choose:'or click to choose a file',search:'Search channels…',sort:'Sort by number',renumber:'Renumber from 1',start:'Start',apply:'Renumber this order',reset:'Reset changes',save:'Save modified ZIP',note:'Drag and drop rows to reorder them. Only the channel number (SRV.major) is changed; frequencies, PIDs and channel names remain untouched.',channel:'Channel',type:'Type',scr:'Encrypted',freq:'Frequency',yes:'Yes',no:'No',radio:'Radio',total:'Total',changed:'Numbers changed',loading:'Loading SQLite engine…',reading:'Reading ZIP…',opened:(f,n)=>`${f} opened. ${n} channels found.`,openFail:'Could not open: ',filter:'Bulk renumbering is disabled while a search filter is active.',numbered:(n,s)=>`${n} channels renumbered starting at ${s}.`,sorted:'Channels sorted by current number.',resetMsg:'Changes in this session were reset.',saved:f=>`Saved: ${f}. Keep the original ZIP before importing this file into your TV.`,footer:'This project is not affiliated with or endorsed by Samsung Electronics. Keep an untouched backup of your original channel-list ZIP.'}};function tx(){const t=T[lang];document.documentElement.lang=lang;document.title=t.title;$('title').textContent=t.title;$('subtitle').textContent=t.sub;$('compatTitle').textContent=t.compat;$('compatBody').innerHTML=t.body;$('detect').textContent=t.detect;$('dropTitle').textContent=t.drop;$('dropSub').textContent=t.choose;$('search').placeholder=t.search;$('sortNo').textContent=t.sort;$('renumber').textContent=t.renumber;$('startLabel').textContent=t.start;$('applyStart').textContent=t.apply;$('reset').textContent=t.reset;$('save').textContent=t.save;$('editorNote').textContent=t.note;$('thChannel').textContent=t.channel;$('thType').textContent=t.type;$('thScrambled').textContent=t.scr;$('thFreq').textContent=t.freq;$('footer').textContent=t.footer;$('trBtn').classList.toggle('active',lang==='tr');$('enBtn').classList.toggle('active',lang==='en');if(channels.length)render()}$('trBtn').onclick=()=>{lang='tr';localStorage.setItem('samsung-editor-lang',lang);tx()};$('enBtn').onclick=()=>{lang='en';localStorage.setItem('samsung-editor-lang',lang);tx()};
const fileEl=$('file'),drop=$('drop'),loadStatus=$('loadStatus'),editor=$('editor'),tbody=$('tbody'),search=$('search'),editStatus=$('editStatus'),chips=$('chips');let SQL=null,zip=null,db=null,satDb=null,sourceFile=null,channels=[],originalMajors=new Map(),tpMap=new Map(),dragId=null;const setLoad=(m,c='')=>{loadStatus.className='status '+c;loadStatus.textContent=m},setEdit=(m,c='')=>{editStatus.className='status '+c;editStatus.textContent=m};function decode(b){if(!b)return'';try{return new TextDecoder('utf-16be').decode(b).replace(/\0/g,'').trim()}catch(_){let s='';for(let i=0;i+1<b.length;i+=2)s+=String.fromCharCode((b[i]<<8)|b[i+1]);return s.replace(/\0/g,'').trim()}}function rows(d,s,p=[]){const st=d.prepare(s);st.bind(p);const o=[];while(st.step())o.push(st.getAsObject());st.free();return o}async function init(){if(SQL)return SQL;setLoad(T[lang].loading);SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/'+f});return SQL}async function loadFile(f){try{editor.classList.add('hidden');setLoad(T[lang].reading);sourceFile=f;await init();zip=await JSZip.loadAsync(await f.arrayBuffer());const e=zip.file('dvbs');if(!e)throw Error("'dvbs' database not found in ZIP.");db=new SQL.Database(new Uint8Array(await e.async('arraybuffer')));const tables=new Set(rows(db,"select name from sqlite_master where type='table'").map(x=>x.name));for(const x of['CHNL','SRV','SRV_DVB'])if(!tables.has(x))throw Error('Required Samsung table not found: '+x);tpMap=new Map();const se=zip.file('sat');if(se)try{satDb=new SQL.Database(new Uint8Array(await se.async('arraybuffer')));rows(satDb,'select tpId,tpFreq,tpPol,tpSr,satId from SAT_TP').forEach(r=>tpMap.set(Number(r.tpId),r))}catch(_){}channels=rows(db,'select SRV.srvId srvId,SRV.major major,cast(SRV.srvName as blob) srvName,SRV.srvType srvType,SRV.scrambled scrambled,SRV.elim elim,CHNL.chNum chNum,CHNL.freq freq,CHNL.sr sr,CHNL.pol pol from SRV inner join CHNL on CHNL.chId=SRV.chId where ifnull(SRV.elim,0)=0 order by SRV.major').map(r=>{const x=tpMap.get(Number(r.chNum));return{srvId:Number(r.srvId),major:Number(r.major),name:decode(r.srvName)||'—',srvType:Number(r.srvType),scrambled:Number(r.scrambled)!==0,freq:x?Number(x.tpFreq):Number(r.freq||0),pol:x?(Number(x.tpPol)===0?'H':'V'):(Number(r.pol)===0?'H':Number(r.pol)===1?'V':'—'),sr:x?Number(x.tpSr):Number(r.sr||0)}});if(!channels.length)throw Error('No active satellite channels found.');if(new Set(channels.map(c=>c.major)).size!==channels.length)throw Error('Duplicate channel numbers found.');originalMajors=new Map(channels.map(c=>[c.srvId,c.major]));$('intro').classList.add('hidden');editor.classList.remove('hidden');setEdit(T[lang].opened(f.name,channels.length),'ok');render()}catch(e){console.error(e);setLoad(T[lang].openFail+(e.message||e),'err')}}const type=x=>(x===2||x===10)?T[lang].radio:'TV';function visible(){const q=search.value.trim().toLocaleLowerCase(lang==='tr'?'tr-TR':'en-US');return q?channels.filter(c=>c.name.toLocaleLowerCase().includes(q)||String(c.major).includes(q)):channels}function render(){tbody.textContent='';for(const c of visible()){const tr=document.createElement('tr');tr.draggable=true;const a=['⋮⋮',null,c.name,type(c.srvType),c.scrambled?T[lang].yes:T[lang].no,c.freq?(c.freq/1000).toFixed(0)+' MHz':'—',c.pol,(c.sr&&c.sr!==65535)?c.sr:'—'];a.forEach((v,i)=>{const td=document.createElement('td');if(i===1){const n=document.createElement('input');n.type='number';n.min='1';n.className='num';n.value=c.major;n.onchange=()=>{const v=Number(n.value);if(!Number.isInteger(v)||v<1)n.value=c.major;else{c.major=v;updateChips()}};td.appendChild(n)}else{td.textContent=v;if(i===2)td.className='name'}tr.appendChild(td)});tr.ondragstart=()=>{dragId=c.srvId;tr.classList.add('dragging')};tr.ondragend=()=>{dragId=null;tr.classList.remove('dragging')};tr.ondragover=e=>{e.preventDefault();tr.classList.add('drop-target')};tr.ondragleave=()=>tr.classList.remove('drop-target');tr.ondrop=e=>{e.preventDefault();tr.classList.remove('drop-target');if(dragId===null||dragId===c.srvId)return;const from=channels.findIndex(x=>x.srvId===dragId),to=channels.findIndex(x=>x.srvId===c.srvId),m=channels.splice(from,1)[0];channels.splice(to,0,m);render()};tbody.appendChild(tr)}updateChips()}function updateChips(){const t=T[lang],changed=channels.filter(c=>c.major!==originalMajors.get(c.srvId)).length,tv=channels.filter(c=>(c.srvType!==2&&c.srvType!==10)).length;chips.innerHTML=[`${t.total}: ${channels.length}`,`TV: ${tv}`,`${t.radio}: ${channels.length-tv}`,`${t.scr}: ${channels.filter(c=>c.scrambled).length}`,`${t.changed}: ${changed}`].map(x=>`<span class="chip">${x}</span>`).join('')}function renumber(s=1){if(search.value.trim()){setEdit(T[lang].filter,'err');return}channels.forEach((c,i)=>c.major=s+i);render();setEdit(T[lang].numbered(channels.length,s),'ok')}async function save(){try{const nums=channels.map(c=>c.major);if(nums.some(n=>!Number.isInteger(n)||n<1)||new Set(nums).size!==nums.length)throw Error('Invalid or duplicate channel numbers.');db.run('BEGIN');try{let st=db.prepare('update SRV set major=? where srvId=?');channels.forEach((c,i)=>st.run([1000000+i,c.srvId]));st.free();st=db.prepare('update SRV set major=? where srvId=?');channels.forEach(c=>st.run([c.major,c.srvId]));st.free();db.run('COMMIT')}catch(e){try{db.run('ROLLBACK')}catch(_){}throw e}const chk=rows(db,'pragma integrity_check'),k=chk[0]&&Object.keys(chk[0])[0];if(!chk[0]||chk[0][k]!=='ok')throw Error('SQLite integrity check failed.');zip.file('dvbs',db.export(),{binary:true});const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),a=document.createElement('a'),url=URL.createObjectURL(blob),name=(sourceFile?.name||'Channel_list.zip').replace(/\.zip$/i,'')+'_edited.zip';a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);originalMajors=new Map(channels.map(c=>[c.srvId,c.major]));updateChips();setEdit(T[lang].saved(name),'ok')}catch(e){setEdit((e.message||e),'err')}}drop.onclick=()=>fileEl.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');const f=e.dataTransfer.files?.[0];if(f)loadFile(f)};fileEl.onchange=()=>fileEl.files?.[0]&&loadFile(fileEl.files[0]);search.oninput=render;$('sortNo').onclick=()=>{channels.sort((a,b)=>a.major-b.major);render();setEdit(T[lang].sorted,'ok')};$('renumber').onclick=()=>renumber(1);$('applyStart').onclick=()=>{const n=Number($('startNo').value);if(Number.isInteger(n)&&n>0)renumber(n)};$('reset').onclick=()=>{channels.forEach(c=>c.major=originalMajors.get(c.srvId));channels.sort((a,b)=>a.major-b.major);render();setEdit(T[lang].resetMsg,'ok')};$('save').onclick=save;tx()})();
