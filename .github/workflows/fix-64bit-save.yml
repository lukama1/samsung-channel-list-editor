name: Fix Samsung 64-bit save path

on:
  push:
    paths:
      - '.github/workflows/fix-64bit-save.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch editor and add export verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              'select SRV.srvId srvId,SRV.major major,cast(SRV.srvName as blob) srvName,',
              'select cast(SRV.srvId as text) srvId,SRV.major major,cast(SRV.srvName as blob) srvName,'
            ),
            (
              "id:'z'+Number(r.srvId),srvId:Number(r.srvId),",
              "id:'z'+String(r.srvId),srvId:String(r.srvId),"
            ),
            (
              'delete from ${tbl} where srvId=?',
              'delete from ${tbl} where cast(srvId as text)=?'
            ),
            (
              "db.prepare('update SRV set major=? where srvId=?')",
              "db.prepare('update SRV set major=? where cast(srvId as text)=?')"
            ),
          ]

          for old, new in replacements:
            if old in s:
              s = s.replace(old, new)
            elif new not in s:
              raise RuntimeError(f'Expected pattern not found: {old}')

          old_num = "ni.onchange=()=>{const v=Number(ni.value);if(Number.isInteger(v)&&v>=0)c.major=v;else ni.value=c.major};"
          new_num = "ni.onchange=()=>{const v=Number(ni.value);if(Number.isInteger(v)&&v>=0){if(v!==c.major){c.major=v;setDirty(true)}}else ni.value=c.major};"
          if old_num in s:
            s = s.replace(old_num, new_num)
          elif new_num not in s:
            raise RuntimeError('Manual number edit handler pattern not found')

          helper_anchor = "function deleteWhere(pred){"
          helper = "function verifyZipMajors(d,expected){const rows=sqlRows(d,\"select cast(srvId as text) srvId,major from SRV where ifnull(elim,0)=0\"),m=new Map(rows.map(r=>[String(r.srvId),Number(r.major)]));const bad=expected.find(c=>m.get(String(c.srvId))!==Number(c.major));if(bad)throw Error((lang==='tr'?'Kaydedilen veritabanı doğrulanamadı: ':'Saved database verification failed: ')+bad.name+' (#'+bad.major+')')}\n"
          if 'function verifyZipMajors(' not in s:
            if helper_anchor not in s:
              raise RuntimeError('Helper insertion anchor not found')
            s = s.replace(helper_anchor, helper + helper_anchor, 1)

          old_export = "const chk=sqlRows(db,'pragma integrity_check'),k=Object.keys(chk[0]||{})[0];if(!chk[0]||chk[0][k]!=='ok')throw Error('SQLite integrity check failed');zip.file('dvbs',db.export(),{binary:true});const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}),name=sourceFile.name.replace(/\\.zip$/i,'')+'_edited.zip';download(blob,name);setDirty(false);setEdit(trn().saved(name),'ok')"
          new_export = "const chk=sqlRows(db,'pragma integrity_check'),k=Object.keys(chk[0]||{})[0];if(!chk[0]||chk[0][k]!=='ok')throw Error('SQLite integrity check failed');const expected=activeChannels();verifyZipMajors(db,expected);const exportedDb=db.export();const verifyDb=new SQL.Database(exportedDb);try{const vc=sqlRows(verifyDb,'pragma integrity_check'),vk=Object.keys(vc[0]||{})[0];if(!vc[0]||vc[0][vk]!=='ok')throw Error('Exported SQLite integrity check failed');verifyZipMajors(verifyDb,expected)}finally{verifyDb.close()}zip.file('dvbs',exportedDb,{binary:true});const zipBytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'});const verifyArchive=await JSZip.loadAsync(zipBytes),savedDvbs=verifyArchive.file('dvbs');if(!savedDvbs)throw Error(\"Exported ZIP does not contain 'dvbs'\");const verifySavedDb=new SQL.Database(new Uint8Array(await savedDvbs.async('arraybuffer')));try{verifyZipMajors(verifySavedDb,expected)}finally{verifySavedDb.close()}const blob=new Blob([zipBytes],{type:'application/zip'}),name=sourceFile.name.replace(/\\.zip$/i,'')+'_edited.zip';download(blob,name);setDirty(false);setEdit(trn().saved(name),'ok')"
          if old_export in s:
            s = s.replace(old_export, new_export, 1)
          elif new_export not in s:
            raise RuntimeError('ZIP export block pattern not found')

          # Guardrails: 64-bit IDs must never be coerced to JS Number in ZIP mode.
          if "srvId:Number(r.srvId)" in s or "id:'z'+Number(r.srvId)" in s:
            raise RuntimeError('Unsafe srvId Number coercion still present')
          if "cast(SRV.srvId as text) srvId" not in s:
            raise RuntimeError('Lossless srvId query missing')
          if s.count("update SRV set major=? where cast(srvId as text)=?") != 2:
            raise RuntimeError('Expected both SRV update statements to use text-safe IDs')
          if 'function verifyZipMajors(' not in s:
            raise RuntimeError('ZIP verification helper missing')

          p.write_text(s, encoding='utf-8')

          # Extract inline JS and check syntax.
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/editor.js').write_text('\n'.join(scripts), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/editor.js'], check=True)
          print('FIX_64BIT_SAVE_OK')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-64bit-save.yml
          git add index.html
          git commit -m 'Fix Samsung 64-bit channel IDs and verify exported ZIP'
          git push origin main
