name: Patch modified-file download button

on:
  push:
    paths:
      - '.github/workflows/patch-save-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Ensure the download button starts disabled and has clear wording.
          s = s.replace("save:'Kaydet'", "save:'Düzenlenmiş Dosyayı İndir'")
          s = s.replace("save:'Save'", "save:'Download Modified File'")
          s = s.replace('<button class="primary" id="save"></button>', '<button class="primary" id="save" disabled></button>')
          if 'button:disabled{' not in s:
              s = s.replace('button{cursor:pointer}', 'button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}')

          # Define dirty-state helper robustly, independent of previous minified layout.
          if 'let dirty=false;' not in s:
              marker = "const $=id=>document.getElementById(id);"
              if marker not in s:
                  raise RuntimeError('Cannot find JS bootstrap marker')
              s = s.replace(marker, marker + "\nlet dirty=false;", 1)

          if 'function setDirty(' not in s:
              marker = "let dirty=false;"
              s = s.replace(marker, marker + "\nfunction setDirty(v=true){dirty=!!v;const b=document.getElementById('save');if(b)b.disabled=!dirty}", 1)

          # Opening a file is not an edit.
          s = s.replace("originalState=snapshot();$('intro').classList.add('hidden');", "originalState=snapshot();setDirty(false);$('intro').classList.add('hidden');")

          # Direct number edit.
          s = s.replace(
              "no.onchange=()=>{c.major=Math.max(0,Number(no.value)||0);updateChips()};",
              "no.onchange=()=>{const next=Math.max(0,Number(no.value)||0);if(next!==c.major){c.major=next;setDirty(true)}updateChips()};"
          )

          # Common mutating actions.
          s = s.replace('function renumberList(list,start){list.forEach((c,i)=>c.major=start+i);render()}',
                        'function renumberList(list,start){list.forEach((c,i)=>c.major=start+i);setDirty(true);render()}')
          s = s.replace('list.forEach(c=>c.deleted=true);selected.clear();render()}',
                        'list.forEach(c=>c.deleted=true);selected.clear();setDirty(true);render()}')
          s = s.replace("$('restoreSelected').onclick=()=>{channels.filter(c=>selected.has(c.id)).forEach(c=>c.deleted=false);render()};",
                        "$('restoreSelected').onclick=()=>{const list=channels.filter(c=>selected.has(c.id)&&c.deleted);if(list.length){list.forEach(c=>c.deleted=false);setDirty(true)}render()};")

          # Reset returns to clean state.
          s = s.replace(
              "function restoreSnapshot(){for(const s of originalState){const c=channels.find(x=>x.id===s.id);if(c){c.major=s.major;c.deleted=s.deleted}}selected.clear();render()}",
              "function restoreSnapshot(){for(const s of originalState){const c=channels.find(x=>x.id===s.id);if(c){c.major=s.major;c.deleted=s.deleted}}selected.clear();setDirty(false);render()}"
          )

          # Download only after a real edit; after download return to clean state.
          s = s.replace('async function saveFile(){try{\n const normalized=ensureUniqueActiveNumbers();',
                        'async function saveFile(){try{\n if(!dirty)return;\n const normalized=ensureUniqueActiveNumbers();')
          s = s.replace("download(blob,name);setEdit(trn().saved(name),'ok')}",
                        "download(blob,name);setDirty(false);setEdit(trn().saved(name),'ok')}")

          p.write_text(s, encoding='utf-8')

          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/editor.js').write_text('\n'.join(scripts), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/editor.js'], check=True)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix modified-file dirty state handling'
          git push origin main
