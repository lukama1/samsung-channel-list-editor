name: Fix modified-file download state

on:
  push:
    paths:
      - '.github/workflows/patch-save-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch editor safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # UI wording/state
          s = s.replace("save:'Kaydet'", "save:'Düzenlenmiş Dosyayı İndir'")
          s = s.replace("save:'Save'", "save:'Download Modified File'")
          s = s.replace('<button class="primary" id="save"></button>', '<button class="primary" id="save" disabled></button>')
          if 'button:disabled{' not in s:
              s = s.replace('button{cursor:pointer}', 'button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}')

          # The state declaration already contains dirty=false from the prior patch.
          # Only add it if it truly does not exist anywhere.
          if not re.search(r'\bdirty\s*=\s*false\b', s):
              state_pat = r"(let SQL=null,format=null,sourceFile=null,zip=null,db=null,scmEntries=null,scmMapEntry=null,channels=\[\],originalState=null,selected=new Set\(\),lastClicked=null,filterType='all',dragId=null,pickOrder=\[\])"
              s, n = re.subn(state_pat, r"\1,dirty=false", s, count=1)
              if n != 1:
                  raise RuntimeError('Could not add dirty state')

          # Add helper exactly once, directly after the main state declaration.
          if 'function setDirty(' not in s:
              state_match = re.search(r"let SQL=null,format=null,sourceFile=null,zip=null,db=null,scmEntries=null,scmMapEntry=null,channels=\[\],originalState=null,selected=new Set\(\),lastClicked=null,filterType='all',dragId=null,pickOrder=\[\],dirty=false;", s)
              if not state_match:
                  raise RuntimeError('Could not find dirty-enabled state declaration')
              helper = "\nfunction setDirty(v=true){dirty=!!v;const b=document.getElementById('save');if(b)b.disabled=!dirty}\n"
              pos = state_match.end()
              s = s[:pos] + helper + s[pos:]

          # Opening a file is clean state.
          s = s.replace("originalState=snapshot();$('intro').classList.add('hidden');", "originalState=snapshot();setDirty(false);$('intro').classList.add('hidden');")

          # Number edit.
          s = s.replace(
              "no.onchange=()=>{c.major=Math.max(0,Number(no.value)||0);updateChips()};",
              "no.onchange=()=>{const next=Math.max(0,Number(no.value)||0);if(next!==c.major){c.major=next;setDirty(true)}updateChips()};"
          )

          # Common mutating actions.
          s = s.replace(
              'function renumberList(list,start){list.forEach((c,i)=>c.major=start+i);render()}',
              'function renumberList(list,start){list.forEach((c,i)=>c.major=start+i);setDirty(true);render()}'
          )
          s = s.replace(
              'list.forEach(c=>c.deleted=true);selected.clear();render()}',
              'list.forEach(c=>c.deleted=true);selected.clear();setDirty(true);render()}'
          )
          s = s.replace(
              "$('restoreSelected').onclick=()=>{channels.filter(c=>selected.has(c.id)).forEach(c=>c.deleted=false);render()};",
              "$('restoreSelected').onclick=()=>{const list=channels.filter(c=>selected.has(c.id)&&c.deleted);if(list.length){list.forEach(c=>c.deleted=false);setDirty(true)}render()};"
          )

          # Drag/search-based full-list reorder paths that may not go through renumberList.
          s = s.replace('rest.forEach((c,i)=>c.major=start+i);render()', 'rest.forEach((c,i)=>c.major=start+i);setDirty(true);render()')
          s = s.replace('full.forEach((c,i)=>c.major=first+i);\n render();', 'full.forEach((c,i)=>c.major=first+i);\n setDirty(true);render();')

          # Reset returns to clean state.
          s = s.replace(
              "function restoreSnapshot(){for(const s of originalState){const c=channels.find(x=>x.id===s.id);if(c){c.major=s.major;c.deleted=s.deleted}}selected.clear();render()}",
              "function restoreSnapshot(){for(const s of originalState){const c=channels.find(x=>x.id===s.id);if(c){c.major=s.major;c.deleted=s.deleted}}selected.clear();setDirty(false);render()}"
          )

          # Download only when dirty and disable after successful download.
          s = s.replace(
              'async function saveFile(){try{\n const normalized=ensureUniqueActiveNumbers();',
              'async function saveFile(){try{\n if(!dirty)return;\n const normalized=ensureUniqueActiveNumbers();'
          )
          s = s.replace(
              "download(blob,name);setEdit(trn().saved(name),'ok')}",
              "download(blob,name);setDirty(false);setEdit(trn().saved(name),'ok')}"
          )

          p.write_text(s, encoding='utf-8')

          # Verify helper exists once and JS parses.
          if s.count('function setDirty(') != 1:
              raise RuntimeError(f'Expected one setDirty helper, got {s.count("function setDirty(")}')
          if not re.search(r'\bdirty\s*=\s*false\b', s):
              raise RuntimeError('dirty state missing')

          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          Path('/tmp/editor.js').write_text('\n'.join(scripts), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/editor.js'], check=True)
          print('PATCH_OK')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix dirty state and modified-file download button'
          git push origin main
